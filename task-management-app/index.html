<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auspify — Task & Deadline Management App</title>
  <style>
    :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; --muted: #64748b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--primary); }
    header {
      background: var(--primary); color: #fff; padding: 14px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 1.2rem; }
    .container { max-width: 1050px; margin: 22px auto; padding: 0 16px; }
    .card {
      background: var(--card); border-radius: 10px; padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 18px;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat-box { background: #fff; border-radius: 10px; padding: 14px; border-left: 4px solid var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,0.05); }
    .stat-box h3 { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .stat-box p { margin: 6px 0 0; font-size: 1.35rem; font-weight: 700; }
    input, select { padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.92rem; }
    button { background: var(--accent); color: #fff; border: none; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.92; }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }
    .form-row { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr 1fr auto; gap: 8px; }
    @media (max-width: 820px) { .form-row { grid-template-columns: 1fr; } }
    .task-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid #e2e8f0;
    }
    .badge { padding: 3px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .High { background: #fee2e2; color: #b91c1c; }
    .Medium { background: #fef3c7; color: #b45309; }
    .Low { background: #dcfce7; color: #15803d; }
    .overdue-tag { color: #dc2626; font-weight: 700; font-size: 0.8rem; margin-left: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Auspify Task & Deadline Manager</h1>
    <div id="nav-bar" class="hidden">
      <span id="user-greeting" style="margin-right: 12px;"></span>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- AUTHENTICATION CARD -->
    <div id="auth-view" class="card" style="max-width: 420px; margin: 40px auto;">
      <h2 id="auth-heading">Sign In</h2>
      <p id="auth-error" style="color: #dc2626; font-size: 0.9rem;"></p>
      <div id="name-box" class="hidden">
        <input id="reg-fullname" type="text" placeholder="Full Name" style="width: 100%; margin-bottom: 10px;" />
      </div>
      <input id="login-user" type="text" placeholder="Username (alphanumeric)" style="width: 100%; margin-bottom: 10px;" />
      <input id="login-pass" type="password" placeholder="Password (min 6 chars)" style="width: 100%; margin-bottom: 14px;" />
      <button id="auth-submit" style="width: 100%;" onclick="handleAuth()">Log In</button>
      <p style="text-align: center; margin-top: 12px; font-size: 0.9rem;">
        <a href="#" id="auth-switch" onclick="switchAuth()">Create a new account</a>
      </p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app-view" class="hidden">
      <!-- AUTOMATED PERFORMANCE SCORE REPORT -->
      <div class="stats-grid">
        <div class="stat-box"><h3>Productivity Score</h3><p id="rep-score">0%</p></div>
        <div class="stat-box" style="border-color: #16a34a;"><h3>Performance Grade</h3><p id="rep-grade">N/A</p></div>
        <div class="stat-box" style="border-color: #f59e0b;"><h3>Completed / Total</h3><p id="rep-counts">0 / 0</p></div>
        <div class="stat-box" style="border-color: #dc2626;"><h3>Overdue Tasks</h3><p id="rep-overdue">0</p></div>
      </div>

      <!-- CREATE TASK FORM -->
      <div class="card">
        <h3 style="margin-top: 0;">Add New Task & Deadline</h3>
        <div class="form-row">
          <input id="t-title" type="text" placeholder="Task title *" />
          <input id="t-desc" type="text" placeholder="Notes / details" />
          <input id="t-cat" type="text" placeholder="Category (e.g. Work)" value="Work" />
          <select id="t-prio">
            <option value="High">High Priority</option>
            <option value="Medium" selected>Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
          <input id="t-due" type="date" />
          <button onclick="addTask()">Add Task</button>
        </div>
      </div>

      <!-- FILTER BAR & TASK LIST -->
      <div class="card">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;">
          <input id="filter-search" type="text" placeholder="Search tasks..." style="flex: 1;" oninput="refreshDashboard()" />
          <select id="filter-status" onchange="refreshDashboard()">
            <option value="All">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="Overdue">Overdue</option>
          </select>
          <select id="filter-prio" onchange="refreshDashboard()">
            <option value="All">All Priorities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div id="task-list"></div>
      </div>
    </div>
  </div>

  <script>
    let registerMode = false;
    let session = null;

    function switchAuth() {
      registerMode = !registerMode;
      document.getElementById("auth-heading").textContent = registerMode ? "Register Account" : "Sign In";
      document.getElementById("auth-submit").textContent = registerMode ? "Register" : "Log In";
      document.getElementById("name-box").classList.toggle("hidden", !registerMode);
      document.getElementById("auth-switch").textContent = registerMode ? "Back to Login" : "Create a new account";
      document.getElementById("auth-error").textContent = "";
    }

    async function handleAuth() {
      const username = document.getElementById("login-user").value;
      const password = document.getElementById("login-pass").value;
      const full_name = document.getElementById("reg-fullname").value;
      const errEl = document.getElementById("auth-error");

      const url = registerMode ? "/api/register" : "/api/login";
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, full_name })
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.style.color = "#dc2626";
        errEl.textContent = data.error || data.message;
        return;
      }

      if (registerMode) {
        switchAuth();
        errEl.style.color = "#16a34a";
        errEl.textContent = data.message;
        return;
      }

      session = data.session;
      document.getElementById("auth-view").classList.add("hidden");
      document.getElementById("nav-bar").classList.remove("hidden");
      document.getElementById("app-view").classList.remove("hidden");
      document.getElementById("user-greeting").textContent = `Welcome, ${session.full_name}`;
      document.getElementById("t-due").valueAsDate = new Date();
      refreshDashboard();
    }

    async function addTask() {
      const payload = {
        title: document.getElementById("t-title").value,
        description: document.getElementById("t-desc").value,
        category: document.getElementById("t-cat").value,
        priority: document.getElementById("t-prio").value,
        due_date: document.getElementById("t-due").value
      };

      const res = await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.token}` },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.message);
        return;
      }
      document.getElementById("t-title").value = "";
      document.getElementById("t-desc").value = "";
      refreshDashboard();
    }

    async function setStatus(taskId, status) {
      await fetch("/api/tasks/status", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.token}` },
        body: JSON.stringify({ task_id: taskId, status })
      });
      refreshDashboard();
    }

    async function removeTask(taskId) {
      await fetch("/api/tasks/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session.token}` },
        body: JSON.stringify({ task_id: taskId })
      });
      refreshDashboard();
    }

    async function refreshDashboard() {
      const search = encodeURIComponent(document.getElementById("filter-search").value);
      const status = encodeURIComponent(document.getElementById("filter-status").value);
      const priority = encodeURIComponent(document.getElementById("filter-prio").value);
      const headers = { "Authorization": `Bearer ${session.token}` };

      const [tasksRes, repRes] = await Promise.all([
        fetch(`/api/tasks?search=${search}&status=${status}&priority=${priority}`, { headers }),
        fetch("/api/report", { headers })
      ]);

      const { tasks } = await tasksRes.json();
      const { report } = await repRes.json();

      document.getElementById("rep-score").textContent = `${report.productivity_score}%`;
      document.getElementById("rep-grade").textContent = report.grade;
      document.getElementById("rep-counts").textContent = `${report.completed} / ${report.total_tasks}`;
      document.getElementById("rep-overdue").textContent = report.overdue;

      const listEl = document.getElementById("task-list");
      if (!tasks.length) {
        listEl.innerHTML = "<p style='color: var(--muted);'>No tasks found. Add one above to get started!</p>";
        return;
      }

      listEl.innerHTML = tasks.map(t => `
        <div class="task-item">
          <div>
            <span class="badge ${t.priority}">${t.priority}</span>
            <strong style="margin-left: 6px; ${t.status === 'Completed' ? 'text-decoration: line-through; color: var(--muted);' : ''}">
              ${t.title}
            </strong>
            ${t.is_overdue ? '<span class="overdue-tag">[OVERDUE]</span>' : ''}
            <div style="font-size: 0.85rem; color: var(--muted); margin-top: 4px;">
              ${t.description ? t.description + ' • ' : ''}Category: ${t.category} • Due: <strong>${t.due_date}</strong> • Status: ${t.status}
            </div>
          </div>
          <div style="display: flex; gap: 6px;">
            ${t.status !== 'Completed' ? `<button class="success" onclick="setStatus(${t.id}, 'Completed')">Complete</button>` : ''}
            <button class="danger" onclick="removeTask(${t.id})">Delete</button>
          </div>
        </div>
      `).join("");
    }

    async function logout() {
      await fetch("/api/logout", {
        method: "POST",
        headers: { "Authorization": `Bearer ${session.token}` }
      });
      session = null;
      document.getElementById("nav-bar").classList.add("hidden");
      document.getElementById("app-view").classList.add("hidden");
      document.getElementById("auth-view").classList.remove("hidden");
    }
  </script>
</body>
</html>
